<!DOCTYPE html>
<html>
<head>
<title>DevOps Training</title>

<style>
body{
  background:#0f1f25;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card{
  background:#1f2f35;
  padding:40px;
  border-radius:10px;
  text-align:center;
  color:white;
  width:400px;
}

h1{
  color:#00d1b2;
}

button{
  background:#00d1b2;
  border:none;
  padding:12px 20px;
  border-radius:6px;
  cursor:pointer;
  margin-top:20px;
}
</style>

</head>

<body>

<div class="card">
<h1>🚀 Welcome to DevOps Training</h1>
<p>Application deployed inside Docker on AWS EC2</p>
<p>Server running on Port 81</p>

<button onclick="check()">Check Container</button>

<p id="msg"></p>

</div>

<script>
function check(){
 document.getElementById("msg").innerHTML=
 "Docker Container Running Successfully 🚀";
}
</script>

</body>
</html>
